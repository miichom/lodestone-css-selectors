[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lodestone-css-selectors"
version = "0.1.0"
description = "A collection of Lodestone CSS selectors and XPath expressions"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

[tool.hatch.build.targets.sdist]
include = ["json/*.json"]

[tool.hatch.build.targets.wheel]
packages = ["json"]